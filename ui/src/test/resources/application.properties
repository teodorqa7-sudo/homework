# Environment under test.
# Leave empty to run the offline smoke scenario against the bundled page
# src/test/resources/pages/smoke.html
ui.baseUrl=

# Public demo back-office used by the @live login scenarios (requires network access).
ui.backOfficeBaseUrl=https://automationplayground.com/back-office/pages
# The demo performs no real authentication. Leave empty here and supply BACK_OFFICE_PASSWORD
# (environment variable) for anything that actually validates credentials.
ui.backOfficePassword=

# Sauce Demo shop used by the @live checkout scenario (requires network access).
ui.sauceDemoBaseUrl=https://www.saucedemo.com
# Public demo password - it is printed on the Sauce Demo login page itself.
# Override with the SAUCE_DEMO_PASSWORD environment variable; never commit real secrets.
ui.sauceDemoPassword=secret_sauce

# chromium | firefox | webkit
ui.browser=chromium
# false -> you can watch the browser
ui.headless=true
ui.defaultTimeoutMs=10000

# Demo / lecture mode - both default to 0 (off), so normal runs are unchanged.
# ui.headless=false + ui.slowMoMs=500 + ui.stepDelayMs=1000 is a good presentation setting.
ui.slowMoMs=0
ui.stepDelayMs=0
