cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=false

# Every scenario runs by default, including the @live ones (back-office login, Sauce Demo
# checkout). They need network access and installed Playwright browsers.
#
# Offline-only run (skips @live):
#   mvn -pl ui -am test "-Dcucumber.filter.tags=not @live"
#
# Only the live group:
#   mvn -pl ui -am test "-Dcucumber.filter.tags=@live"
