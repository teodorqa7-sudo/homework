cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=false

# Every scenario runs by default, including the @live Petstore user scenario, which needs
# network access.
#
# Offline-only run (skips @live):
#   mvn -pl api -am test "-Dcucumber.filter.tags=not @live"
#
# Only the live group:
#   mvn -pl api -am test "-Dcucumber.filter.tags=@live"
